name: Continuous Tuning

# Champion/challenger self-improvement, run CONTINUOUSLY: one workflow run =
# one improve-or-discard cycle (4 parallel VMs generate corpus shards with the
# CURRENT champion; one job merges, tunes a challenger, gates it vs the
# champion in a real match, and promotes it only on a win).
#
# Sessions CHAIN: a successful cycle dispatches the next cycle for the same
# engine with the same inputs, so tuning runs session-after-session until you
# set the stop flag:
#
#   gh variable set TUNING_V3_ENABLED --body false   # stop v3 after current session
#   gh variable set TUNING_V2_ENABLED --body false   # stop v2 after current session
#
# (Settings -> Secrets and variables -> Actions -> Variables in the web UI.)
# The stop flag is checked at session start, so the in-flight session finishes
# naturally and nothing new starts. Crons are infrequent self-heal backstops
# for the case where a chained dispatch is missed (failures do not chain).

on:
  schedule:
    - cron: '15 */3 * * *' # v3 self-heal backstop (chain normally self-dispatches)
    - cron: '45 2 * * *' # v2 self-heal backstop
  workflow_dispatch:
    inputs:
      engine:
        description: 'Engine to tune (v3 flagship | v2 ladder)'
        default: 'v3'
      corpus-games:
        description: 'Total self-play games per cycle (4 shards); empty = engine default (v3 4000 / v2 12000)'
        default: ''
      match-pairs:
        description: 'Paired games (x2) for the acceptance gate'
        default: '20'

permissions:
  contents: write
  actions: write

concurrency:
  group: tuning-${{ github.event.inputs.engine || 'v3' }}
  cancel-in-progress: false

jobs:
  corpus:
    if: ${{ (github.event.inputs.engine || 'v3') == 'v3' && vars.TUNING_V3_ENABLED != 'false' || (github.event.inputs.engine || 'v3') == 'v2' && vars.TUNING_V2_ENABLED != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ENGINE: ${{ github.event.inputs.engine || 'v3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Resolve corpus size, champion file (seed if missing)
        run: |
          GAMES="${{ github.event.inputs.corpus-games }}"
          if [ -z "$GAMES" ]; then
            if [ "$ENGINE" = "v2" ]; then GAMES=12000; else GAMES=4000; fi
          fi
          echo "GAMES=$GAMES" >> "$GITHUB_ENV"
          FILE=data/params-current.json
          if [ "$ENGINE" = "v2" ]; then FILE=data/params-current-v2.json; fi
          if [ ! -f "$FILE" ]; then
            printf '{"note":"factory defaults","scalars":{},"tables":{}}\n' > "$FILE"
          fi
          echo "CHAMPION=$FILE" >> "$GITHUB_ENV"

      - name: Generate corpus shard
        run: |
          npx tsx scripts/gen-corpus.ts \
            --engine "$ENGINE" \
            --games $((GAMES / 4)) \
            --depth 5 \
            --seed ${{ github.run_id }}0${{ matrix.shard }} \
            --out "data/artifacts/corpus-shard-${{ matrix.shard }}.txt" \
            --params "$CHAMPION"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}-${{ matrix.shard }}
          path: data/artifacts/corpus-shard-${{ matrix.shard }}.txt
          retention-days: 14

  tune-gate:
    if: ${{ (github.event.inputs.engine || 'v3') == 'v3' && vars.TUNING_V3_ENABLED != 'false' || (github.event.inputs.engine || 'v3') == 'v2' && vars.TUNING_V2_ENABLED != 'false' }}
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ENGINE: ${{ github.event.inputs.engine || 'v3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Configure git identity (tune-session commits champions)
        run: |
          git config user.name "tuning-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: actions/download-artifact@v4
        with:
          path: data/artifacts/
          pattern: corpus-${{ github.run_id }}-*
          merge-multiple: true

      - name: Merge corpus shards
        run: |
          cat data/artifacts/corpus-shard-*.txt > data/artifacts/corpus-merged.txt
          wc -l data/artifacts/corpus-merged.txt

      - name: Tune challenger and gate against champion
        run: |
          npx tsx scripts/tune-session.ts \
            --engine "$ENGINE" \
            --cycles 1 \
            --corpus data/artifacts/corpus-merged.txt \
            --match-pairs "${{ github.event.inputs.match-pairs || '20' }}" \
            --movetime 250 \
            --sweeps 8

      - name: Push accepted champions
        run: |
          git add data/params-current.json data/params-current-v2.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "tune: publish champion from session ${{ github.run_id }}"
          fi
          git pull --rebase origin main || true
          git push origin main || echo "push failed — champion kept in artifacts"

      - name: Chain next session (unless stopped)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENGINE" = "v2" ] && [ "${{ vars.TUNING_V2_ENABLED }}" = "false" ]; then
            echo "stop flag set — chaining halted after this session"; exit 0
          fi
          if [ "$ENGINE" = "v3" ] && [ "${{ vars.TUNING_V3_ENABLED }}" = "false" ]; then
            echo "stop flag set — chaining halted after this session"; exit 0
          fi
          GAMES="${{ github.event.inputs.corpus-games }}"
          if [ -z "$GAMES" ]; then
            if [ "$ENGINE" = "v2" ]; then GAMES=12000; else GAMES=4000; fi
          fi
          gh workflow run tune.yml \
            --ref main \
            -f engine="$ENGINE" \
            -f corpus-games="$GAMES" \
            -f match-pairs="${{ github.event.inputs.match-pairs || '20' }}"
          echo "chained next $ENGINE session (games=$GAMES)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-${{ github.run_id }}
          path: |
            data/artifacts/
            data/params-current*.json
          retention-days: 30
