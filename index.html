<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chess0 v3 — Grandmaster-grade TypeScript chess workbench with 3-line Multi-PV search, real-time move classification, and opening explorer."
    />
    <meta property="og:title" content="Chess0 v3 — Grandmaster Chess Engine & Analysis Workbench" />
    <meta
      property="og:description"
      content="Play and analyze with Chess0 v3: 3-line Multi-PV search, real-time move classification, accuracy metrics, and Grandmaster opening repertoire."
    />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f17'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%2310b981'%3E%E2%99%9E%3C/text%3E%3C/svg%3E"
    />
    <title>Chess0 v3 — Grandmaster Chess Engine & Analysis Workbench</title>
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('chess0-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
