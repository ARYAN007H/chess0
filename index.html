<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chess0 — a chess engine written 100% from scratch in TypeScript, playing live in your browser." />
    <meta name="theme-color" content="#0f172a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%2338bdf8'%3E%E2%99%9E%3C/text%3E%3C/svg%3E"
    />
    <title>Chess0 — from-scratch chess engine</title>
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        var t;
        try {
          t = localStorage.getItem('chess0-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
